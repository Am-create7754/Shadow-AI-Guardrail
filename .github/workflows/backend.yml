name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml", ".github/scripts/**"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml", ".github/scripts/**"]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    env:
      GUARDRAIL_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q -rf --junitxml=junit.xml
      - name: Report failing tests as annotations
        if: failure()
        run: python ../.github/scripts/junit_annotations.py junit.xml
      - name: Dependency audit (known vulnerabilities)
        run: python -m pip_audit --strict --progress-spinner off
      - name: API fuzzing (no request may cause a server error)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m loadtest.fuzz --max-examples 50
      - name: Load test (second machine; results as annotations)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m loadtest.run --requests 300 --concurrency 16 --github-notice
