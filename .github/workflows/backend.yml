name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml", ".github/scripts/**"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml", ".github/scripts/**"]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    env:
      GUARDRAIL_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q -rf --junitxml=junit.xml
      - name: Report failing tests as annotations
        if: failure()
        run: python ../.github/scripts/junit_annotations.py junit.xml
